<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090b"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#12171f"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="#00f59b"/>

  <!-- Technical Frame Borders -->
  <rect x="50" y="50" width="1100" height="530" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>

  <!-- Alignment Ticks -->
  <path d="M 40 60 L 40 40 L 60 40" stroke="#00f59b" stroke-width="3" fill="none"/>
  <path d="M 1160 60 L 1160 40 L 1140 40" stroke="#00f59b" stroke-width="3" fill="none"/>
  <path d="M 40 570 L 40 590 L 60 590" stroke="#00f59b" stroke-width="3" fill="none"/>
  <path d="M 1160 570 L 1160 590 L 1140 590" stroke="#00f59b" stroke-width="3" fill="none"/>

  <!-- Terminal Icon Badge -->
  <g transform="translate(100, 110)">
    <rect width="64" height="64" rx="14" fill="#171e28" stroke="#00f59b" stroke-width="2"/>
    <path d="M 22 22 L 32 32 L 22 42" stroke="#00f59b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 36 42 L 46 42" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Signal Deck Subtitle -->
  <text x="180" y="145" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="600" fill="#00f59b" letter-spacing="4">
    LINKVAULT // DIGITAL SIGNAL DECK
  </text>
  <text x="180" y="170" font-family="'JetBrains Mono', monospace" font-size="14" fill="#8697ac" letter-spacing="2">
    OPEN-SOURCE • PRIVACY-FIRST IDENTITY INFRASTRUCTURE
  </text>

  <!-- Name & Headline -->
  <text x="100" y="270" font-family="'Inter', -apple-system, sans-serif" font-size="56" font-weight="800" fill="#f0f6fc" letter-spacing="-1">
    Ashish Singh Bora
  </text>
  <text x="100" y="325" font-family="'JetBrains Mono', monospace" font-size="26" font-weight="600" fill="#00e5ff">
    Systems &amp; Security Engineer • Open Source Architect
  </text>

  <!-- Bio Quote -->
  <text x="100" y="380" font-family="'Inter', sans-serif" font-size="20" fill="#b5c2d1">
    Building high-assurance distributed systems, cryptographic tooling,
  </text>
  <text x="100" y="415" font-family="'Inter', sans-serif" font-size="20" fill="#b5c2d1">
    and privacy-preserving infrastructure on static GitHub Pages.
  </text>

  <!-- Technical Telemetry Footer -->
  <rect x="100" y="480" width="1000" height="48" rx="8" fill="#12171f" stroke="rgba(255, 255, 255, 0.08)"/>
  <circle cx="125" cy="504" r="5" fill="#00f59b"/>
  <text x="145" y="509" font-family="'JetBrains Mono', monospace" font-size="14" fill="#f0f6fc">
    ZERO TELEMETRY
  </text>
  <text x="320" y="509" font-family="'JetBrains Mono', monospace" font-size="14" fill="#8697ac">
    STATIC HOSTED
  </text>
  <text x="480" y="509" font-family="'JetBrains Mono', monospace" font-size="14" fill="#8697ac">
    LOCAL ZERO-TRUST STUDIO
  </text>
  <text x="760" y="509" font-family="'JetBrains Mono', monospace" font-size="14" fill="#00f59b">
    github.com/ashishsinghbora/LinkVault
  </text>
</svg>
